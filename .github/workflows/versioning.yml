name: Auto Versioning

on:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

concurrency:
  group: versioning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Determine and publish version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Lorenzo Giannoccaro
          GIT_AUTHOR_EMAIL: lorenzo.giannoccaro998@gmail.com
          GIT_COMMITTER_NAME: Lorenzo Giannoccaro
          GIT_COMMITTER_EMAIL: lorenzo.giannoccaro998@gmail.com
        run: npx semantic-release

      - name: Dispatch atomic native release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin master --tags
          release_commit="$(git rev-parse origin/master)"
          if [[ "$release_commit" == "$GITHUB_SHA" ]]; then
            echo "No release commit was created."
            exit 0
          fi
          tag="$(git tag --points-at "$release_commit" --list 'v*.*.*' --sort=-version:refname | head -n 1)"
          if [[ -z "$tag" ]]; then
            echo "The release commit has no semantic version tag." >&2
            exit 1
          fi
          gh workflow run release.yml --ref "$tag"
